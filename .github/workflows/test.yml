name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup your environment (language-specific)
      # ... (examples below)

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run tests
      - name: Run unit tests
        run: npm test
